# unbind C-b
# set -g prefix C-b
# bind-key C-h send-prefix
set -g mouse on
set-option -g allow-rename off
set -g mode-keys vi

# bind-key -T copy-mode-vi v send-keys -X begin-selection
# bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
# bind-key -T copy-mode-vi Enter send-keys -X copy-selection-and-cancel
# bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"
# bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "wl-copy"
#bind-key -T prefix C-v run-shell "tmux set-buffer -- \"$(wl-paste -n | cat))\"; tmux paste-buffer -p"
if-shell 'test -f "$HOME/Code/tmux-yank/yank.tmux"' 'run-shell "$HOME/Code/tmux-yank/yank.tmux"'


# Hide status bar if only one window in the current session
set-hook -g after-new-session 'if -F "#{==:#{session_windows},1}" "set -F status off" "set -F status on"'
set-hook -g window-linked 'if -F "#{==:#{session_windows},1}" "set -F status off" "set -F status on"'
set-hook -g window-unlinked 'if -F "#{==:#{session_windows},1}" "set -F status off" "set -F status on"'

set -g update-environment "DISPLAY SSH_ASKPASS SSH_AGENT_PID SSH_CONNECTION WINDOWID XAUTHORITY WAYLAND_DISPLAY XDG_RUNTIME_DIR"

# Unbind C-h from its default (move left) and send to the inner session
unbind C-h

# Enable OSC 52 clipboard forwarding for remote Neovim yanks.
set -as terminal-features ",*:clipboard"
